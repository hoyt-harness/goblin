name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          bad=$(goimports -l . 2>/dev/null | grep -v vendor || true)
          if [ -n "$bad" ]; then
            echo "goimports: run 'goimports -w .' to fix:"
            echo "$bad"
            exit 1
          fi

      - name: positronikal-check
        run: |
          pip install --quiet positronikal-standards-check 2>/dev/null || true
          if command -v positronikal-check >/dev/null 2>&1; then
            positronikal-check .
          fi
