name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: github/codeql-action/init@c4dd10e4d873808a4a7e5157804cc2c8afe2e5f6 # v3.27.6
        with:
          languages: go

      - uses: github/codeql-action/autobuild@c4dd10e4d873808a4a7e5157804cc2c8afe2e5f6 # v3.27.6

      - uses: github/codeql-action/analyze@c4dd10e4d873808a4a7e5157804cc2c8afe2e5f6 # v3.27.6
        with:
          category: "/language:go"
